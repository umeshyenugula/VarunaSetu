<text x="262.0" y="127" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Authenticate</text>
<text x="232.0" y="154" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#cfe6f5">enrolled, fresh,</text>
<text x="232.0" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#cfe6f5">never replayed</text>
