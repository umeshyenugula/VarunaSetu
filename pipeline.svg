<title id="t">VarunaSetu verification pipeline</title><desc id="d">Seven stages: sign, authenticate, verify, decide, persist, chain, observe</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2c"/><stop offset="1" stop-color="#0d3a56"/></linearGradient><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7dd3fc"/></marker></defs>
<rect width="1280" height="230" rx="18" fill="url(#bg)"/>
<text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">One reading, seven checkpoints</text>
<text x="40" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9fc6dd">Every claim is authenticated, physically bounded, compared with its H3 neighbourhood, and recorded before it can earn credit.</text>
