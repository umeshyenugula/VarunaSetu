services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hydroledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydroledger}
      POSTGRES_DB: ${POSTGRES_DB:-hydroledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hydroledger} -d ${POSTGRES_DB:-hydroledger}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hydroledger}:${POSTGRES_PASSWORD:-hydroledger}@db:5432/${POSTGRES_DB:-hydroledger}?sslmode=disable}
      HTTP_ADDR: :8080
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:5173}
      # Enables /simulator/* (device enrolment for the dashboard story). Demo only.
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/hydroledger-server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Standalone judge demo. It embeds its OWN API + database view on 8090 and is
  # NOT the backend the dashboard talks to (that is `api` on 8080).
  # docker compose --profile demo up --build citysim  ->  http://localhost:8090/
  citysim:
    build:
      context: .
      dockerfile: Dockerfile
      target: citysim
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hydroledger}:${POSTGRES_PASSWORD:-hydroledger}@db:5432/${POSTGRES_DB:-hydroledger}?sslmode=disable}
    ports:
      - "${CITYSIM_PORT:-8090}:8090"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["demo"]

  dashboard:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    depends_on:
      - api
    profiles: ["ui"]

volumes:
  pgdata:
  dashboard_node_modules:
